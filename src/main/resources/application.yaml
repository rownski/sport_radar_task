spring:
  application:
    name: world-cup-scoreboard
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scoreboard}
    username: ${DB_USER:scoreboard}
    password: ${DB_PASSWORD:scoreboard_dev}
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

scoreboard:
  # Empty means all supported FIFA teams. Otherwise supply exactly 48 distinct names.
  teams: []
