services:
  database:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-scoreboard}
      POSTGRES_USER: ${DB_USER:-scoreboard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scoreboard_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://database:5432/${DB_NAME:-scoreboard}
      DB_USER: ${DB_USER:-scoreboard}
      DB_PASSWORD: ${DB_PASSWORD:-scoreboard_dev}
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres-data:
